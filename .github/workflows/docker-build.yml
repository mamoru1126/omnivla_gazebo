name: docker-build

on:
  push:
    branches: [master]
    paths:
      - "docker/**"
      - "omnivla_nav/**"
      - "ros2_ws/**"
      - "tests/**"
      - ".github/workflows/docker-build.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Free disk space (image is ~15GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /
      - uses: actions/checkout@v4
      - name: Build image (also runs import check + unit tests inside)
        run: |
          set -o pipefail
          mkdir -p log
          DOCKER_BUILDKIT=1 docker build --progress=plain -f docker/Dockerfile -t omnivla_gazebo:ci . 2>&1 | tee log/ci-docker-build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-log
          path: log/ci-docker-build.log
      - name: Publish log to ci-logs branch
        if: always()
        run: |
          cp log/ci-docker-build.log /tmp/build.log || echo "no log" > /tmp/build.log
          grep -n -i -E "error|failed|conflict|cannot|not found" /tmp/build.log | tail -200 > /tmp/errors.txt || true
          tail -n 400 /tmp/build.log > /tmp/tail.log
          cd /tmp && rm -rf cilog && mkdir cilog && cd cilog && git init -q
          cp /tmp/tail.log /tmp/errors.txt .
          echo "run=${{ github.run_id }} sha=${{ github.sha }} status=${{ job.status }}" > info.txt
          git -c user.name=ci -c user.email=ci@example.com add . && git -c user.name=ci -c user.email=ci@example.com commit -qm "log ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs
