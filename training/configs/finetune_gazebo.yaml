# OmniVLA LoRA fine-tuning on Gazebo data (training/finetune_omnivla.py)
# 目安: RTX 3090/4090 (24GB) で batch_size 2 + gradient checkpointing。足りなければ lora_target: llm
vla_path: /checkpoints/omnivla-original
base_step: -1
resume_from: ""

# --- data (auto_explorer / data_collector の出力ディレクトリ。下位の軌跡を再帰的に探す) ---
data_dirs:
  - /data/raw
val_ratio: 0.05
metric_waypoint_spacing: 0.1      # 公式推論 (run_omnivla.py) と同じ。記録 3Hz x 0.3m/s ≒ 0.1m/frame
waypoint_spacing: 1
max_goal_dist: 30.0
image_goal_offset: [2, 30]        # 画像ゴールはフレーム数で 2〜30 先 (≒0.2〜3m)
pose_goal_offset: [2, 300]
modality_weights:                 # image=6, image_pose=5, pose=4 (language は Gazebo データに指示文が無いので使わない)
  image: 0.5
  image_pose: 0.25
  pose: 0.25
augment: true
crop_v: 0.1
crop_h: 0.05
flip_prob: 0.5
color_jitter: 0.2
num_workers: 6

# --- optimization ---
batch_size: 2
grad_accumulation_steps: 4        # 実効バッチ 8
max_steps: 5000
learning_rate: 1.0e-4
weight_decay: 0.01
lr_warmup_steps: 100
lr_decay_step: 4000
lr_decay_gamma: 0.1
max_grad_norm: 1.0
smooth_loss_weight: 0.1
gradient_checkpointing: true

# --- LoRA ---
lora_rank: 32
lora_dropout: 0.0
lora_target: all
train_heads: true

# --- logging / checkpoints ---
run_root: /runs
run_name: ""
log_freq: 10
val_freq: 500
val_batches: 50
val_at_start: true               # 学習前 (= ゼロショット) の検証誤差も記録
num_viz: 8
save_freq: 1000
keep_last: 3
save_optimizer: false
wandb_project: ""
wandb_entity: ""
seed: 42
dry_run: false
